<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮球规则智能问答</title>
    <style>
        :root {
            --orange: #f15a24;
            --orange-dark: #d44a1a;
            --orange-light: #fff0ea;
            --bg: #0f0f14;
            --surface: #1a1a22;
            --card: #ffffff;
            --text: #1a1a1e;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 780px;
            height: 90vh;
            max-height: 800px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a28 0%, #22223a 100%);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .logo {
            width: 42px; height: 42px;
            background: var(--orange);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .header-info h1 {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.3px;
        }

        .header-info span {
            color: rgba(255,255,255,.55);
            font-size: 12px;
        }

        .header-actions {
            margin-left: auto;
            display: flex; gap: 8px;
        }

        .btn-icon {
            width: 36px; height: 36px;
            border: none; border-radius: 10px;
            background: rgba(255,255,255,.08);
            color: rgba(255,255,255,.7);
            cursor: pointer;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            transition: all .2s;
        }
        .btn-icon:hover { background: rgba(255,255,255,.15); color: #fff; }

        /* Quick Chips */
        .quick-row {
            padding: 14px 24px;
            display: flex; gap: 8px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: #fafbfc;
        }

        .chip {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: #fff;
            color: var(--text-muted);
            font-size: 12.5px;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .chip:hover {
            border-color: var(--orange);
            color: var(--orange);
            background: var(--orange-light);
        }

        /* Chat */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 40px 20px 20px;
            animation: fadeIn .5s ease;
        }
        .welcome .icon { font-size: 48px; margin-bottom: 12px; }
        .welcome h2 {
            font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px;
        }
        .welcome p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }

        /* Messages */
        .msg {
            display: flex; gap: 10px;
            animation: msgIn .35s cubic-bezier(.16,1,.3,1);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .msg.user .msg-avatar { background: var(--orange); }
        .msg.assistant .msg-avatar { background: #e8edf2; }

        .msg-body { max-width: 82%; }

        .msg-bubble {
            padding: 12px 16px; border-radius: 14px;
            font-size: 14.5px; line-height: 1.65;
            word-break: break-word;
        }
        .msg.user .msg-bubble {
            background: var(--orange);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant .msg-bubble {
            background: #f3f4f6;
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .msg.assistant .msg-bubble strong { color: #2563eb; font-weight: 600; }
        .msg.error .msg-bubble { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        /* Sources */
        .sources {
            margin-top: 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }
        .sources-toggle {
            width: 100%; padding: 8px 14px;
            border: none; background: #fafbfc;
            color: var(--text-muted); font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            text-align: left;
        }
        .sources-toggle:hover { background: #f3f4f6; }
        .sources-toggle .arrow { transition: transform .2s; font-size: 10px; }
        .sources.open .sources-toggle .arrow { transform: rotate(180deg); }

        .sources-list { display: none; padding: 8px 14px 10px; }
        .sources.open .sources-list { display: block; }

        .source-item {
            font-size: 12px; color: var(--text-muted);
            padding: 5px 0;
            border-bottom: 1px solid #f3f4f6;
            line-height: 1.5;
        }
        .source-item:last-child { border-bottom: none; }
        .source-item::before { content: '📎 '; font-size: 10px; }

        /* Typing */
        .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dots span {
            width: 7px; height: 7px;
            background: #9ca3af; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: .16s; }
        .typing-dots span:nth-child(3) { animation-delay: .32s; }
        @keyframes bounce {
            0%,80%,100% { transform: scale(.7); opacity: .4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input */
        .input-bar {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0;
            background: #fff;
        }

        .input-bar input {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            font-size: 14.5px;
            outline: none;
            transition: border-color .2s;
            font-family: inherit;
            background: #fafbfc;
        }
        .input-bar input:focus {
            border-color: var(--orange);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(241,90,36,.08);
        }

        .btn-send {
            width: 44px; height: 44px;
            border: none; border-radius: 50%;
            background: var(--orange);
            color: #fff; font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all .2s;
            flex-shrink: 0;
        }
        .btn-send:hover:not(:disabled) {
            background: var(--orange-dark);
            transform: scale(1.04);
        }
        .btn-send:disabled { opacity: .5; cursor: not-allowed; }

        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 0; }
            .container { height: 100vh; max-height: none; border-radius: 0; }
            .msg-body { max-width: 88%; }
            .quick-row { padding: 10px 14px; gap: 6px; }
            .chat-area { padding: 14px 16px; }
            .input-bar { padding: 10px 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🏀</div>
            <div class="header-info">
                <h1>篮球规则智能问答</h1>
                <span>AI 知识助手 · 规则 + 球员</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="resetChat()" title="清空对话">↺</button>
            </div>
        </div>

        <!-- Quick Chips -->
        <div class="quick-row">
            <button class="chip" onclick="send('篮球比赛的得分规则是什么？')">得分规则</button>
            <button class="chip" onclick="send('什么叫走步违例？')">走步违例</button>
            <button class="chip" onclick="send('郭艾伦打什么位置？')">郭艾伦</button>
            <button class="chip" onclick="send('易建联的身高是多少？')">易建联</button>
            <button class="chip" onclick="send('姚明的职业生涯荣誉有哪些？')">姚明</button>
            <button class="chip" onclick="send('库里是谁？')">库里</button>
        </div>

        <!-- Chat -->
        <div class="chat-area" id="chat">
            <div class="welcome" id="welcome">
                <div class="icon">🏀</div>
                <h2>篮球知识问答助手</h2>
                <p>我可以回答篮球规则、CBA/NBA球员信息<br>试试上方快捷问题或直接输入</p>
            </div>
        </div>

        <!-- Input -->
        <div class="input-bar">
            <input type="text" id="inp" placeholder="输入问题..." onkeydown="if(event.key==='Enter')send()">
            <button class="btn-send" id="sendBtn" onclick="send()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const sid = localStorage.getItem('bb_sid') || (() => {
            const s = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
            localStorage.setItem('bb_sid', s);
            return s;
        })();

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function md2html(text) {
            if (!text) return '';
            let h = esc(text);
            // Bold
            h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Tables
            h = h.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g, (m, head, body) => {
                const ths = head.split('|').map(c => c.trim()).filter(c => c).map(c => `<th>${c}</th>`).join('');
                const rows = body.trim().split('\n').map(row => {
                    const tds = row.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('');
                    return `<tr>${tds}</tr>`;
                }).join('');
                return `<table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
            });
            // Headings
            h = h.replace(/^### (.+)$/gm, '<h3 style="font-size:15px;margin:10px 0 4px;">$1</h3>');
            h = h.replace(/^## (.+)$/gm, '<h2 style="font-size:16px;margin:12px 0 4px;color:#f15a24;">$1</h2>');
            // Lists
            h = h.replace(/^- (.+)$/gm, '<li style="margin:3px 0 3px 18px;">$1</li>');
            // Newlines
            h = h.replace(/\n{2,}/g, '<br><br>');
            h = h.replace(/\n/g, '<br>');
            return h;
        }

        function addMsg(role, content, sources) {
            const chat = document.getElementById('chat');
            const wel = document.getElementById('welcome');
            if (wel) wel.remove();

            const div = document.createElement('div');
            div.className = 'msg ' + role;

            const ava = document.createElement('div');
            ava.className = 'msg-avatar';
            ava.textContent = role === 'user' ? '👤' : '🏀';

            const body = document.createElement('div');
            body.className = 'msg-body';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = role === 'user' ? esc(content) : md2html(content);

            body.appendChild(bubble);

            if (sources && sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.innerHTML = `
                    <button class="sources-toggle" onclick="this.parentElement.classList.toggle('open')">
                        <span class="arrow">▾</span> 参考来源 (${sources.length})
                    </button>
                    <div class="sources-list">
                        ${sources.map(s => `<div class="source-item">${esc(s)}</div>`).join('')}
                    </div>
                `;
                body.appendChild(srcDiv);
            }

            div.appendChild(ava);
            div.appendChild(body);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function addTyping() {
            const chat = document.getElementById('chat');
            const wel = document.getElementById('welcome');
            if (wel) wel.remove();

            const div = document.createElement('div');
            div.className = 'msg assistant';
            div.id = 'typing';
            div.innerHTML = `
                <div class="msg-avatar">🏀</div>
                <div class="msg-body">
                    <div class="msg-bubble">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function send(q) {
            const inp = document.getElementById('inp');
            const btn = document.getElementById('sendBtn');
            const question = q || inp.value.trim();
            if (!question) return;

            if (!q) inp.value = '';
            btn.disabled = true;

            addMsg('user', question);
            addTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, session_id: sid })
                });
                const data = await res.json();
                removeTyping();

                if (data.error) {
                    const err = addMsg('assistant', '');
                    err.className = 'msg assistant error';
                    err.querySelector('.msg-bubble').innerHTML = '出错了：' + esc(data.error);
                } else {
                    addMsg('assistant', data.answer, data.sources || []);
                }
            } catch (e) {
                removeTyping();
                const err = addMsg('assistant', '');
                err.className = 'msg assistant error';
                err.querySelector('.msg-bubble').textContent = '网络错误：' + e.message;
            }

            btn.disabled = false;
            inp.focus();
        }

        async function resetChat() {
            if (!confirm('确定要清空对话吗？')) return;
            await fetch('/api/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sid })
            });
            localStorage.removeItem('bb_sid');
            location.reload();
        }

        // Load history
        (async () => {
            try {
                const res = await fetch(`/api/history?session_id=${sid}`);
                const data = await res.json();
                if (data.history && data.history.length > 0) {
                    const wel = document.getElementById('welcome');
                    if (wel) wel.remove();
                    data.history.forEach(m => addMsg(m.role, m.content));
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>
