<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮球规则智能问答</title>
    <style>
        /* ============================================
           DESIGN TOKENS — Primitive Scale
           ============================================ */

        /* Orange Primary */
        :root {
            --orange-50:  #fff5f0;
            --orange-100: #ffe8dd;
            --orange-200: #ffceb5;
            --orange-300: #ffa87d;
            --orange-400: #ff7a45;
            --orange-500: #f15a24;
            --orange-600: #d44a1a;
            --orange-700: #b83b12;
            --orange-800: #8f2d0d;
            --orange-900: #6b2008;
        }

        /* Neutral Gray */
        :root {
            --gray-50:  #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --gray-950: #030712;
        }

        /* Spacing (4px base) */
        :root {
            --space-1:  0.25rem;
            --space-2:  0.5rem;
            --space-3:  0.75rem;
            --space-4:  1rem;
            --space-5:  1.25rem;
            --space-6:  1.5rem;
            --space-8:  2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
        }

        /* Typography */
        :root {
            --text-xs:   0.75rem;
            --text-sm:   0.875rem;
            --text-base: 1rem;
            --text-lg:   1.125rem;
            --text-xl:   1.25rem;
            --text-2xl:  1.5rem;
            --leading-tight:  1.25;
            --leading-normal: 1.5;
            --leading-relaxed: 1.625;
            --font-normal:  400;
            --font-medium:  500;
            --font-semibold: 600;
            --font-bold:    700;
        }

        /* Border Radius */
        :root {
            --radius-sm:   0.375rem;
            --radius-md:   0.5rem;
            --radius-lg:   0.75rem;
            --radius-xl:   1rem;
            --radius-2xl:  1.25rem;
            --radius-3xl:  1.5rem;
            --radius-full: 9999px;
        }

        /* Shadows */
        :root {
            --shadow-sm:  0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md:  0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg:  0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
            --shadow-xl:  0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.06);
        }

        /* Duration */
        :root {
            --duration-fast:   150ms;
            --duration-normal: 200ms;
            --duration-slow:   300ms;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
           SEMANTIC TOKENS — Light Theme
           ============================================ */
        :root {
            --color-bg:            #f0f2f5;
            --color-surface:       rgba(255,255,255,0.72);
            --color-surface-solid: #ffffff;
            --color-text:          var(--gray-900);
            --color-text-secondary: var(--gray-500);
            --color-text-tertiary:  var(--gray-400);
            --color-border:        var(--gray-200);
            --color-border-light:  var(--gray-100);
            --color-primary:       var(--orange-500);
            --color-primary-hover: var(--orange-600);
            --color-primary-light: var(--orange-50);
            --color-primary-fg:    #ffffff;
            --color-bubble-user:   var(--orange-500);
            --color-bubble-ai:     var(--gray-100);
            --color-bubble-ai-text: var(--gray-900);
            --color-error-bg:      #fef2f2;
            --color-error-text:    #dc2626;
            --color-error-border:  #fecaca;
            --glass-blur:          16px;
            --glass-alpha:         0.72;
        }

        /* ============================================
           GLOBAL RESET & BASE
           ============================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            font-size: var(--text-base);
            line-height: var(--leading-normal);
            color: var(--color-text);
            background: var(--color-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-6);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 20%, rgba(241,90,36,0.06) 0%, transparent 100%),
                radial-gradient(ellipse 60% 80% at 80% 80%, rgba(241,90,36,0.04) 0%, transparent 100%);
        }

        /* ============================================
           CONTAINER — Glass Card
           ============================================ */
        .container {
            width: 100%;
            max-width: 820px;
            height: 92vh;
            max-height: 880px;
            background: var(--color-surface);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl), 0 0 0 1px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow var(--duration-slow) var(--ease-in-out);
        }
        .container:focus-within {
            box-shadow: var(--shadow-xl), 0 0 0 1px rgba(241,90,36,0.15);
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            background: linear-gradient(135deg, rgba(26,26,40,0.92) 0%, rgba(34,34,58,0.92) 100%);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            padding: var(--space-4) var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--orange-600) 100%);
            border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(241,90,36,0.35);
        }
        .logo svg { width: 22px; height: 22px; color: #fff; }

        .header-info h1 {
            color: #fff;
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            letter-spacing: -0.01em;
        }
        .header-info span {
            color: rgba(255,255,255,0.5);
            font-size: var(--text-xs);
            margin-top: 1px;
            display: block;
        }

        .header-actions {
            margin-left: auto;
            display: flex; gap: var(--space-2);
        }

        .btn-icon {
            width: 36px; height: 36px;
            border: none;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background var(--duration-fast) var(--ease-in-out),
                        color var(--duration-fast) var(--ease-in-out),
                        transform var(--duration-fast) var(--ease-out);
            position: relative;
        }
        .btn-icon svg { width: 18px; height: 18px; }
        .btn-icon:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .btn-icon:active { transform: scale(0.94); }
        .btn-icon:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
        }

        /* ============================================
           QUICK CHIPS
           ============================================ */
        .quick-row {
            padding: var(--space-3) var(--space-6);
            display: flex; gap: var(--space-2); flex-wrap: wrap;
            border-bottom: 1px solid var(--color-border-light);
            flex-shrink: 0;
            background: var(--color-surface-solid);
        }

        .chip {
            padding: 6px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            background: var(--color-surface-solid);
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
            font-family: inherit;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-in-out);
            white-space: nowrap;
            user-select: none;
            position: relative;
        }
        .chip:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-primary-light);
            transform: translateY(-1px);
        }
        .chip:active {
            transform: scale(0.96);
            transition: transform var(--duration-fast) var(--ease-out);
        }
        .chip:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--color-primary-light), 0 0 0 4px var(--color-primary);
        }

        /* ============================================
           CHAT AREA
           ============================================ */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-5) var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
            scroll-behavior: smooth;
            background: var(--color-surface-solid);
        }

        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: var(--radius-full);
        }
        .chat-area::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: var(--space-12) var(--space-6) var(--space-8);
            animation: welcomeIn 0.5s var(--ease-out);
        }
        @keyframes welcomeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 72px; height: 72px;
            margin: 0 auto var(--space-4);
            background: linear-gradient(135deg, var(--orange-100) 0%, var(--color-primary-light) 100%);
            border-radius: var(--radius-2xl);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(241,90,36,0.15);
        }
        .welcome-icon svg { width: 36px; height: 36px; color: var(--color-primary); }

        .welcome h2 {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--color-text);
            margin-bottom: var(--space-2);
        }
        .welcome p {
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
            max-width: 360px;
            margin: 0 auto;
        }

        /* Messages */
        .msg {
            display: flex; gap: var(--space-3);
            animation: msgIn 0.35s var(--ease-out);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 34px; height: 34px;
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 0;
        }
        .msg.user .msg-avatar {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--orange-600) 100%);
            box-shadow: 0 2px 8px rgba(241,90,36,0.25);
        }
        .msg.assistant .msg-avatar {
            background: var(--gray-200);
        }
        .msg-avatar svg { width: 18px; height: 18px; }

        .msg-body { max-width: 82%; min-width: 0; }

        .msg-bubble {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-xl);
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
            word-break: break-word;
            position: relative;
        }
        .msg.user .msg-bubble {
            background: var(--color-bubble-user);
            color: #fff;
            border-bottom-right-radius: var(--radius-md);
            box-shadow: 0 2px 8px rgba(241,90,36,0.2);
        }
        .msg.assistant .msg-bubble {
            background: var(--color-bubble-ai);
            color: var(--color-bubble-ai-text);
            border-bottom-left-radius: var(--radius-md);
        }
        .msg.assistant .msg-bubble strong { color: var(--color-primary); font-weight: var(--font-semibold); }
        .msg.error .msg-bubble {
            background: var(--color-error-bg);
            color: var(--color-error-text);
            border: 1px solid var(--color-error-border);
        }

        /* Markdown table in bubble */
        .msg-bubble table {
            width: 100%; border-collapse: collapse; margin: var(--space-2) 0;
            font-size: var(--text-xs); border-radius: var(--radius-sm); overflow: hidden;
        }
        .msg-bubble th {
            background: var(--gray-100); padding: 6px 10px; text-align: left;
            font-weight: var(--font-semibold); border-bottom: 1px solid var(--gray-200);
        }
        .msg-bubble td {
            padding: 6px 10px; border-bottom: 1px solid var(--gray-100);
        }
        .msg-bubble h2, .msg-bubble h3 {
            font-size: var(--text-base); margin: var(--space-2) 0 var(--space-1);
            color: var(--color-primary);
        }
        .msg-bubble li { margin: 2px 0 2px 18px; }

        /* Sources */
        .sources {
            margin-top: var(--space-2);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--color-surface-solid);
            transition: box-shadow var(--duration-fast) var(--ease-in-out);
        }
        .sources.open { box-shadow: var(--shadow-sm); }
        .sources-toggle {
            width: 100%; padding: var(--space-2) var(--space-3);
            border: none; background: var(--gray-50);
            color: var(--color-text-secondary);
            font-size: var(--text-xs);
            font-family: inherit;
            cursor: pointer;
            display: flex; align-items: center; gap: var(--space-1);
            text-align: left;
            transition: background var(--duration-fast) var(--ease-in-out);
        }
        .sources-toggle:hover { background: var(--gray-100); }
        .sources-toggle:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--color-primary);
        }
        .sources-toggle .arrow {
            transition: transform var(--duration-normal) var(--ease-out);
            width: 12px; height: 12px;
            flex-shrink: 0;
        }
        .sources.open .sources-toggle .arrow { transform: rotate(180deg); }

        .sources-list { display: none; padding: var(--space-2) var(--space-3) var(--space-3); }
        .sources.open .sources-list { display: block; }

        .source-item {
            font-size: var(--text-xs);
            color: var(--color-text-secondary);
            padding: var(--space-1) 0;
            border-bottom: 1px solid var(--gray-100);
            line-height: var(--leading-relaxed);
            display: flex; gap: var(--space-2); align-items: baseline;
        }
        .source-item:last-child { border-bottom: none; }
        .source-item .src-icon {
            flex-shrink: 0; width: 14px; height: 14px; color: var(--gray-400); margin-top: 2px;
        }

        /* Typing dots */
        .typing-dots {
            display: flex; gap: 4px; padding: 2px 0; align-items: center;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            background: var(--gray-400); border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.32s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ============================================
           INPUT BAR
           ============================================ */
        .input-bar {
            padding: var(--space-3) var(--space-6) var(--space-4);
            border-top: 1px solid var(--color-border-light);
            display: flex; gap: var(--space-3); align-items: center;
            flex-shrink: 0;
            background: var(--color-surface-solid);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-bar input {
            width: 100%;
            padding: 11px 18px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-family: inherit;
            outline: none;
            background: var(--gray-50);
            color: var(--color-text);
            transition: border-color var(--duration-fast) var(--ease-in-out),
                        box-shadow var(--duration-fast) var(--ease-in-out),
                        background var(--duration-fast) var(--ease-in-out);
        }
        .input-bar input::placeholder { color: var(--color-text-tertiary); }
        .input-bar input:focus {
            border-color: var(--color-primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(241,90,36,0.12);
        }
        .input-bar input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-send {
            width: 42px; height: 42px;
            border: none; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--orange-600) 100%);
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all var(--duration-fast) var(--ease-out);
            box-shadow: 0 2px 8px rgba(241,90,36,0.3);
            position: relative;
        }
        .btn-send svg { width: 18px; height: 18px; }
        .btn-send:hover:not(:disabled) {
            background: var(--color-primary-hover);
            transform: scale(1.06);
            box-shadow: 0 4px 14px rgba(241,90,36,0.4);
        }
        .btn-send:active:not(:disabled) {
            transform: scale(0.94);
            transition: transform 100ms var(--ease-out);
        }
        .btn-send:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(241,90,36,0.3);
        }
        .btn-send:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-send:disabled::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================
           REDUCED MOTION
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .chat-area { scroll-behavior: auto; }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 640px) {
            body { padding: 0; }
            .container {
                height: 100vh; height: 100dvh;
                max-height: none; border-radius: 0;
            }
            .header { padding: var(--space-3) var(--space-4); }
            .quick-row { padding: var(--space-2) var(--space-4); gap: 6px; }
            .chat-area { padding: var(--space-3) var(--space-4); gap: var(--space-4); }
            .input-bar { padding: var(--space-2) var(--space-4) var(--space-3); }
            .msg-body { max-width: 88%; }
            .chip { padding: 5px 12px; font-size: var(--text-xs); }
        }

        @media (min-width: 1024px) {
            .container { max-width: 860px; }
            .msg-body { max-width: 76%; }
            .welcome { padding: var(--space-16) var(--space-8) var(--space-10); }
        }

        /* ============================================
           UTILITY: SR-ONLY
           ============================================ */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>
    <div class="container" role="main">
        <!-- Header -->
        <header class="header">
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M4.93 4.93c3.9 3.9 10.24 3.9 14.14 0"/>
                    <path d="M4.93 19.07c3.9-3.9 10.24-3.9 14.14 0"/>
                    <line x1="12" y1="2" x2="12" y2="22"/>
                </svg>
            </div>
            <div class="header-info">
                <h1>篮球规则智能问答</h1>
                <span>AI 知识助手 · 规则解读 + 球员百科</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="resetChat()" title="清空对话" aria-label="清空对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Quick Chips -->
        <nav class="quick-row" aria-label="快捷问题">
            <button class="chip" onclick="send('篮球比赛的得分规则是什么？')">得分规则</button>
            <button class="chip" onclick="send('什么叫走步违例？')">走步违例</button>
            <button class="chip" onclick="send('郭艾伦打什么位置？')">郭艾伦</button>
            <button class="chip" onclick="send('易建联的身高是多少？')">易建联</button>
            <button class="chip" onclick="send('姚明的职业生涯荣誉有哪些？')">姚明</button>
            <button class="chip" onclick="send('库里是谁？')">库里</button>
        </nav>

        <!-- Chat Area -->
        <div class="chat-area" id="chat" role="log" aria-live="polite" aria-label="对话区域">
            <div class="welcome" id="welcome">
                <div class="welcome-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M4.93 4.93c3.9 3.9 10.24 3.9 14.14 0"/>
                        <path d="M4.93 19.07c3.9-3.9 10.24-3.9 14.14 0"/>
                        <line x1="12" y1="2" x2="12" y2="22"/>
                    </svg>
                </div>
                <h2>篮球知识问答助手</h2>
                <p>我可以回答篮球规则、CBA/NBA球员信息<br>试试上方快捷问题或直接输入你的疑问</p>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-bar">
            <div class="input-wrapper">
                <label for="inp" class="sr-only">输入问题</label>
                <input type="text" id="inp" placeholder="输入篮球相关问题…"
                       autocomplete="off"
                       onkeydown="if(event.key==='Enter')send()">
            </div>
            <button class="btn-send" id="sendBtn" onclick="send()" aria-label="发送消息">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const sid = localStorage.getItem('bb_sid') || (() => {
            const s = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
            localStorage.setItem('bb_sid', s);
            return s;
        })();

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function md2html(text) {
            if (!text) return '';
            let h = esc(text);
            h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            h = h.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g, (m, head, body) => {
                const ths = head.split('|').map(c => c.trim()).filter(c => c).map(c => `<th>${c}</th>`).join('');
                const rows = body.trim().split('\n').map(row => {
                    const tds = row.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('');
                    return `<tr>${tds}</tr>`;
                }).join('');
                return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
            });
            h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            h = h.replace(/^- (.+)$/gm, '<li>$1</li>');
            h = h.replace(/\n{2,}/g, '<br><br>');
            h = h.replace(/\n/g, '<br>');
            return h;
        }

        function addMsg(role, content, sources) {
            const chat = document.getElementById('chat');
            const wel = document.getElementById('welcome');
            if (wel) wel.remove();

            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.setAttribute('role', 'article');

            const ava = document.createElement('div');
            ava.className = 'msg-avatar';
            ava.setAttribute('aria-hidden', 'true');
            if (role === 'user') {
                ava.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#fff"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            } else {
                ava.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gray-500)"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93c3.9 3.9 10.24 3.9 14.14 0"/><path d="M4.93 19.07c3.9-3.9 10.24-3.9 14.14 0"/><line x1="12" y1="2" x2="12" y2="22"/></svg>';
            }

            const body = document.createElement('div');
            body.className = 'msg-body';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = role === 'user' ? esc(content) : md2html(content);

            body.appendChild(bubble);

            if (sources && sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.innerHTML =
                    '<button class="sources-toggle" onclick="this.parentElement.classList.toggle(\'open\')" aria-expanded="false">' +
                        '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
                        ' 参考来源 (' + sources.length + ')' +
                    '</button>' +
                    '<div class="sources-list">' +
                        sources.map(function(s) {
                            return '<div class="source-item"><svg class="src-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' + esc(s) + '</div>';
                        }).join('') +
                    '</div>';
                body.appendChild(srcDiv);
            }

            div.appendChild(ava);
            div.appendChild(body);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function addTyping() {
            const chat = document.getElementById('chat');
            const wel = document.getElementById('welcome');
            if (wel) wel.remove();

            const div = document.createElement('div');
            div.className = 'msg assistant';
            div.id = 'typing';
            div.setAttribute('aria-label', '正在生成回答');
            div.innerHTML =
                '<div class="msg-avatar" aria-hidden="true">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gray-500)"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93c3.9 3.9 10.24 3.9 14.14 0"/><path d="M4.93 19.07c3.9-3.9 10.24-3.9 14.14 0"/><line x1="12" y1="2" x2="12" y2="22"/></svg>' +
                '</div>' +
                '<div class="msg-body">' +
                    '<div class="msg-bubble">' +
                        '<div class="typing-dots"><span></span><span></span><span></span></div>' +
                    '</div>' +
                '</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function send(q) {
            const inp = document.getElementById('inp');
            const btn = document.getElementById('sendBtn');
            const question = q || inp.value.trim();
            if (!question) return;

            if (!q) inp.value = '';
            btn.disabled = true;
            inp.disabled = true;

            addMsg('user', question);
            addTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: sid })
                });
                const data = await res.json();
                removeTyping();

                if (data.error) {
                    const err = addMsg('assistant', '');
                    err.className = 'msg assistant error';
                    err.querySelector('.msg-bubble').innerHTML = '出错了：' + esc(data.error);
                } else {
                    addMsg('assistant', data.answer, data.sources || []);
                }
            } catch (e) {
                removeTyping();
                const err = addMsg('assistant', '');
                err.className = 'msg assistant error';
                err.querySelector('.msg-bubble').textContent = '网络错误：' + e.message;
            }

            btn.disabled = false;
            inp.disabled = false;
            inp.focus();
        }

        async function resetChat() {
            if (!confirm('确定要清空对话吗？')) return;
            await fetch('/api/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sid })
            });
            localStorage.removeItem('bb_sid');
            location.reload();
        }

        // Load history
        (async () => {
            try {
                const res = await fetch('/api/history?session_id=' + sid);
                const data = await res.json();
                if (data.history && data.history.length > 0) {
                    const wel = document.getElementById('welcome');
                    if (wel) wel.remove();
                    data.history.forEach(function(m) {
                        addMsg(m.role, m.content);
                    });
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>
